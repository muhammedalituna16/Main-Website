<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 - Lost at Sea | Tavuk Games</title>
  <meta name="description"
    content="404 Page Not Found - Looks like you're lost at sea. Even our chicken couldn't find this page." />
  <link rel="icon" type="image/png" href="favicon/favicon-96x96.png" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="favicon/favicon.svg" />
  <link rel="shortcut icon" href="favicon/favicon.ico" />
  <meta name="theme-color" content="#000000">

  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&display=swap" rel="stylesheet" />

  <style>
    body {
      font-family: "Lato", sans-serif;
      background-color: #000000;
      color: #f3f4f6;
    }

    .font-display {
      font-family: "Luckiest Guy", cursive;
      letter-spacing: 0.05em;
    }

    @keyframes chaosWobble {
      0% {
        transform: scale(1.03) rotate(0deg);
      }

      25% {
        transform: scale(1.04) rotate(-2deg);
      }

      50% {
        transform: scale(1.03) rotate(2deg);
      }

      75% {
        transform: scale(1.04) rotate(-1deg);
      }

      100% {
        transform: scale(1.03) rotate(0deg);
      }
    }

    .btn-chaos-wobble:hover {
      animation: chaosWobble 0.4s ease-in-out infinite;
      box-shadow: 0 0 25px rgba(249, 215, 32, 0.6), 0 0 50px rgba(249, 215, 32, 0.2);
    }

    @keyframes mascotBob {

      0%,
      100% {
        transform: translateY(0) rotate(0deg);
      }

      25% {
        transform: translateY(-10px) rotate(-2deg);
      }

      50% {
        transform: translateY(-3px) rotate(1.5deg);
      }

      75% {
        transform: translateY(-12px) rotate(2deg);
      }
    }

    .mascot-bob {
      animation: mascotBob 3.5s ease-in-out infinite;
      transform-origin: bottom center;
    }
  </style>
</head>

<body class="min-h-screen flex flex-col items-center justify-center p-6 text-center bg-black relative overflow-hidden">

  <!-- Background subtle glow -->
  <div
    class="absolute inset-0 bg-[radial-gradient(circle_at_center,rgba(249,215,32,0.06)_0,transparent_70%)] pointer-events-none">
  </div>

  <main class="relative z-10 max-w-xl mx-auto flex flex-col items-center">
    <!-- Animated Mascot -->
    <div class="w-48 h-48 mb-6 mascot-bob">
      <picture>
        <source srcset="images/brand/mascot.webp" type="image/webp">
        <img src="images/brand/mascot.png" alt="Tavuk Games Mascot" class="w-full h-full object-contain" width="192"
          height="192">
      </picture>
    </div>

    <h1 class="font-display text-5xl sm:text-6xl text-white mb-4 leading-tight">
      ERROR 404
    </h1>

    <p class="text-lg text-gray-400 mb-8 max-w-md leading-relaxed">
      Even our chicken couldn't find this page. The coordinates were
      wrong.
    </p>

    <div class="flex flex-col sm:flex-row items-center gap-4 w-full justify-center">
      <a href="index.html"
        class="btn-chaos-wobble w-full sm:w-auto inline-flex items-center justify-center gap-2 px-8 py-4 bg-[#f9d720] text-black font-black text-xs uppercase tracking-wider rounded-xl shadow-lg cursor-pointer">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
        </svg>
        <span>Back to Safety</span>
      </a>
    </div>
  </main>

</body>

</html>
